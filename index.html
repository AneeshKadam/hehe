<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-container">
    <div class="moving-circle-1"></div>
    <div class="moving-circle-2"></div>
    <div class="moving-circle-3"></div>
  </div>

    <h1>Aero</h1>
    <p>Click a box below to play the game instantly</p>
<div class="game-grid" id="truffledGrid"></div>
    <div id="jumpscare-overlay">
  <div class="jumpscare-text">YOU'LL NEVER SEE IT</div>
  <div class="jumpscare-text sub-text">COMING !!</div>
  <button id="escape-btn" onclick="closePrank()">haha get ragebaited</button>
</div>

<audio id="ragebait-audio" src="ragebait.mp3"></audio>

<script>
  var prankTimer;

  function triggerJumpscare() {
    var overlay = document.getElementById('jumpscare-overlay');
    var audio = document.getElementById('ragebait-audio');
    var escapeBtn = document.getElementById('escape-btn');

    // show overlay and enable animation
    overlay.style.display = 'flex';
    overlay.classList.add('active-prank');

    // play audio if available
    audio.currentTime = 0;
    audio.play().catch(function(e){ /* autoplay blocked or missing file */ });

    // after 35s stop flashing and show escape
    prankTimer = setTimeout(function() {
      overlay.classList.remove('active-prank');
      overlay.style.backgroundColor = '#121212';
      escapeBtn.style.display = 'block';
    }, 35000);
  }

  function closePrank() {
    var overlay = document.getElementById('jumpscare-overlay');
    var escapeBtn = document.getElementById('escape-btn');
    var audio = document.getElementById('ragebait-audio');

    // stop and cleanup
    audio.pause();
    audio.currentTime = 0;
    clearTimeout(prankTimer);

    // hide overlay and stop animation
    overlay.classList.remove('active-prank');
    overlay.style.display = 'none';
    escapeBtn.style.display = 'none';
  }
    const name = document.createElement("p");
      
async function loadTruffledGames() {
  const grid = document.getElementById("truffledGrid");

  try {
    const response = await fetch("truffled/games.json");

    if (!response.ok) {
      throw new Error(`games.json returned ${response.status}`);
    }

    const games = await response.json();
    const fragment = document.createDocumentFragment();

    games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";

      const inner = document.createElement("div");
      inner.className = "card-inner";

      const link = document.createElement("a");
      link.href = "truffled-game.html?game=" +
        encodeURIComponent("truffled/" + game.game);

      const img = document.createElement("img");
      img.src = "truffled/" + game.cover;
      img.className = "game-img";
      img.alt = game.name;
      img.loading = "lazy";

      const hover = document.createElement("div");
      hover.className = "hover-text";

      const name = document.createElement("p");
      name.textContent = game.name;

      link.appendChild(img);
      hover.appendChild(name);
      inner.append(link, hover);
      card.appendChild(inner);
      fragment.appendChild(card);
    });

    grid.appendChild(fragment);
  } catch (error) {
    console.error("Failed to load Truffled games:", error);
    grid.textContent = "Games could not be loaded. Check the console.";
  }
}

loadTruffledGames();

loadTruffledGames();
    const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", function () {
    const searchValue = searchInput.value.toLowerCase().trim();

    const gameCards = document.querySelectorAll(".game-card");

    gameCards.forEach(card => {
        const gameName = card.querySelector(".hover-text p");

        if (!gameName) return;

        const name = gameName.textContent.toLowerCase();

        card.style.display = name.includes(searchValue)
            ? "flex"
            : "none";
    });
});
</script>



</body>
</html>
